<style>
html,body{margin:0;height:100%;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#ffffff}
.msg{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;color:#1f2a37}
.msg h2{margin:0 0 8px}
#splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;background:#e9ebef;color:#6b7a8c;transition:opacity .25s}
#splash.off{opacity:0;pointer-events:none}
.scard{width:100%;max-width:420px;background:linear-gradient(135deg,#0b5f63,#312e81);border-radius:22px;padding:22px 18px;display:flex;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.splate{background:#fff;border-radius:18px;padding:14px 16px;width:88%;max-width:340px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.splate img{width:100%;display:block}
.sline{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(15,118,110,.25);border-top-color:#0f766e;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){#splash{background:#0f1318;color:#9aa7b6}.spin{border-color:rgba(45,212,191,.25);border-top-color:#2dd4bf}}
</style>
</head>
